name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: build & bilingual gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires >=22.23.4; the runner image still ships 22.23.3.
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify every published entry has en + zh
        run: node scripts/check-bilingual.mjs
